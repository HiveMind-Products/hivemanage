name: Build Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  dockerImage: 'ghcr.io/hivemind-products/hivemanage'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: ./build/package/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.dockerImage }}:latest
            ${{ env.dockerImage }}:develop
          build-args: |
            LITE_VERSION=hivemanage-dev
