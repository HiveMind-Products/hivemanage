# -----------------------------------------------------------------------------
# Local / development infrastructure for HiveManage (Fivemanage Lite).
#
# This file provisions the backing services (Postgres, ClickHouse, MinIO,
# Jaeger) only -- it does NOT run the application itself. For a real deployment
# run the published image (ghcr.io/hivemind-products/hivemanage) from your
# orchestrator and point it at these (or managed) services.
#
# Credentials below are placeholders for local use only. Override them via your
# own environment before using anywhere that is not a throwaway dev machine.
# -----------------------------------------------------------------------------
name: "Fivemanage Lite"

services:
  lite-database:
    image: postgres:16
    container_name: lite-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fivemanage-lite-dev
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fivemanage-lite-dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fivemanage
  lite-jaeger:
    image: jaegertracing/jaeger:2.4.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "5778:5778"
      - "9411:9411"
  lite-clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: always
    container_name: lite-clickhouse
    environment:
      CLICKHOUSE_PASSWORD: password
    ports:
      - '18123:8123'
      - '19000:9000'
    volumes:
      - clickhouse-data:/var/lib/clickhouse/
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fivemanage
  lite-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lite-minio
    ports:
      - "9000:9000" 
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - ./.docker/minio/data:/data
    networks:
      - fivemanage

networks:
  fivemanage:
    driver: bridge


volumes:
  clickhouse-data: { driver: local }
