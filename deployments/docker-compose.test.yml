name: "Fivemanage Lite Test"

services:
  database-test:
    image: postgres:16
    container_name: lite_database_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fivemanage-lite-test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - fivemanage
  clickhouse-test:
    image: clickhouse/clickhouse-server:24.8
    container_name: lite_clickhouse_test
    environment:
      CLICKHOUSE_PASSWORD: password
    ports:
      - "18123:8123"
      - "19000:9000"
    networks:
      - fivemanage
  minio-test:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lite_minio_test
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      - /data
    networks:
      - fivemanage
networks:
  fivemanage:
    driver: bridge
